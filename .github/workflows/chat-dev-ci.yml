name: Chat Dev CI

on:
  pull_request:
    paths:
      - 'chat_dev/**'
      - 'deploy/**'
      - '.github/workflows/chat-dev-ci.yml'
  push:
    branches: ['agent/chat-dev-foundation', 'release/chat-dev']
    paths:
      - 'chat_dev/**'
      - 'deploy/**'
      - '.github/workflows/chat-dev-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m compileall -q chat_dev
      - name: Adapter tests
        run: python chat_dev/test_adapters.py
      - name: Revenue tests
        run: python chat_dev/test_revenue.py
      - name: Chat Dev smoke test
        run: python chat_dev/test_smoke.py
      - name: Check deployment shell syntax
        run: sh -n deploy/pull-deploy.sh
      - name: Reject obvious committed secrets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          patterns = [
              re.compile(r"BEGIN (?:RSA|OPENSSH|EC) PRIVATE KEY"),
              re.compile(r"GOX_AUTH_PASSWORD=[^$\s]"),
              re.compile(r'''password\s*[:=]\s*["'][^"']+''', re.IGNORECASE),
          ]

          matches = []
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          for name in tracked:
              if name.startswith("docs/"):
                  continue
              path = Path(name)
              try:
                  text = path.read_text(encoding="utf-8", errors="ignore")
              except (OSError, UnicodeError):
                  continue
              for lineno, line in enumerate(text.splitlines(), 1):
                  if any(pattern.search(line) for pattern in patterns):
                      matches.append(f"{name}:{lineno}")

          if matches:
              print("Potential committed secret detected:")
              print("\n".join(matches))
              raise SystemExit(1)
          PY
