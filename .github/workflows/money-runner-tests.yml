name: Money Runner Tests

on:
  push:
    branches:
      - gox/money-runner-v1
  pull_request:
    paths:
      - 'revenue/money_runner.py'
      - 'revenue/test_money_runner.py'
      - '.github/workflows/money-runner-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest revenue.test_money_runner -v
