<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOX ChatDev Cockpit</title><style>body{font-family:system-ui;background:#101217;color:#eef;margin:0;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card{background:#181c24;border:1px solid #303744;border-radius:14px;padding:16px}.role{font-size:22px;font-weight:700}.money{font-size:30px;font-weight:800}.muted{opacity:.7}.job{padding:10px 0;border-bottom:1px solid #303744}.gate{border:1px solid #845;padding:12px;border-radius:12px;margin-top:10px}</style></head><body><h1>GOX ChatDev Cockpit</h1><p class="muted">Visible PM → Developer → Tester → Reviewer loop, owner gates, jobs, and money proof.</p><div id="roles" class="grid"></div><h2>Money</h2><div id="money" class="grid"></div><h2>Owner Gates</h2><div id="gates"></div><h2>Jobs</h2><div id="jobs" class="card"></div><script>
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){try{let r=await fetch('/api/state');let s=await r.json();let R=document.getElementById('roles');R.innerHTML='';for(const [k,v] of Object.entries(s.roles)){R.innerHTML+=`<div class="card"><div class="role">${esc(k.toUpperCase())}</div><div>${esc(v)}</div></div>`}document.getElementById('money').innerHTML=`<div class="card"><div class="muted">Verified earned</div><div class="money">$${Number(s.money.earned||0).toFixed(2)}</div></div><div class="card"><div class="muted">Expected, probability-weighted</div><div class="money">$${Number(s.money.expected||0).toFixed(2)}</div></div>`;let G=document.getElementById('gates');G.innerHTML=s.approvals.length?'':'<div class="card">No owner action required.</div>';for(const a of s.approvals){G.innerHTML+=`<div class="gate"><b>${esc(a.title||a.id)}</b><div>${esc(a.reason||'')}</div><div>${esc(a.action||'')}</div></div>`}let J=document.getElementById('jobs');J.innerHTML=s.jobs.length?'':'No jobs recorded yet.';for(const j of s.jobs){J.innerHTML+=`<div class="job"><b>${esc(j.kind)}</b> — ${esc(j.status)}<br><span class="muted">${esc(j.job_id)} ${j.lane_id?'· '+esc(j.lane_id):''} · attempts ${esc(j.attempt_count)}/${esc(j.max_attempts)}</span>${j.last_error?'<br>'+esc(j.last_error):''}</div>`}}catch(e){document.getElementById('jobs').textContent='Cockpit connection error: '+e.message}}
load();setInterval(load,3000);
</script></body></html>
